<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Общие стили */
        body {
            background-color: #f8f9fa; /* Светлый фон */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh; /* Высота body равна высоте экрана */
            display: flex;
            flex-direction: column;
        }

        /* Стили для бокового меню */
        .sidebar {
            height: 100vh;
            background-color: #343a40; /* Темный фон */
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            padding-top: 20px;
        }

        .sidebar h3 {
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            margin: 10px 0;
        }

        .sidebar ul li a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            display: block;
            transition: background-color 0.3s;
        }

        .sidebar ul li a:hover {
            background-color: #495057; /* Темный фон при наведении */
        }

        /* Стили для основного контента */
        .content {
            margin-left: 250px;
            padding: 20px;
            flex: 1; /* Растягиваем контент на всю доступную высоту */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; /* Отступ между карточкой и текстом */
        }

        /* Стили для карточки с формой */
        .form-card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 400px;
        }

        .form-card h2 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-card input,
        .form-card textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .form-card textarea {
            resize: vertical; /* Разрешаем вертикальное изменение размера */
            height: 100px;
        }

        .form-card button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .form-card button:hover {
            background-color: #0056b3;
        }

        /* Стили для текста "Наши контакты" */
        .contacts {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 400px;
        }

        .contacts h2 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .contacts p {
            font-size: 1rem;
            color: #666;
            margin-bottom: 15px;
        }

        /* Стили для бургер-меню пользователя */
        .user-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 250px;
            background-color: #343a40; /* Темный фон */
            padding: 10px;
            text-align: center;
        }

        .user-menu .dropdown {
            position: relative;
            display: inline-block;
        }

        .user-menu .dropdown-btn {
            background-color: #495057;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .user-menu .dropdown-btn:hover {
            background-color: #6c757d;
        }

        .user-menu .dropdown-content {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            background-color: #343a40; /* Темный фон */
            min-width: 160px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 5px;
            overflow: hidden;
        }

        .user-menu .dropdown-content a {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
            transition: background-color 0.3s;
        }

        .user-menu .dropdown-content a:hover {
            background-color: #495057; /* Темный фон при наведении */
        }

        .user-menu .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Боковое меню -->
    <div class="sidebar">
        <h3>Магазин</h3>
        <ul>
            <li><a href="#">Главная</a></li>
            <li><a href="#">Категория</a></li>
            <li><a href="#">Заказы</a></li>
            <li><a href="#">Контакты</a></li>
        </ul>
    </div>

    <!-- Основной контент -->
    <div class="content">
        <!-- Карточка с формой -->
        <div class="form-card">
            <h2>Свяжитесь с нами</h2>
            <form>
                <input type="text" placeholder="Ваше имя" required>
                <input type="email" placeholder="Ваша почта" required>
                <textarea placeholder="Ваше сообщение" required></textarea>
                <button type="submit">Отправить</button>
            </form>
        </div>

        <!-- Текст "Наши контакты" -->
        <div class="contacts">
            <h2>Наши контакты</h2>
            <p>Телефон: +7 (123) 456-78-90</p>
            <p>Email: info@example.com</p>
            <p>Адрес: г. Москва, ул. Примерная, д. 123</p>
        </div>
    </div>

    <!-- Бургер-меню пользователя -->
    <div class="user-menu">
        <div class="dropdown">
            <button class="dropdown-btn">Пользователь</button>
            <div class="dropdown-content">
                <a href="#">Профиль</a>
                <a href="#">Выход</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
