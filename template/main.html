<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Общие стили */
        body {
            background-color: #f8f9fa; /* Светлый фон */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Стили для бокового меню */
        .sidebar {
            height: 100vh;
            background-color: #343a40; /* Темный фон */
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            padding-top: 20px;
        }

        .sidebar h3 {
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            margin: 10px 0;
        }

        .sidebar ul li a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            display: block;
            transition: background-color 0.3s;
        }

        .sidebar ul li a:hover {
            background-color: #495057; /* Темный фон при наведении */
        }

        /* Стили для основного контента */
        .content {
            margin-left: 250px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            border: none;
            border-radius: 15px; /* Закругленные края */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            width: 300px;
            margin: 0 15px; /* Отступ между карточками */
            background-color: white;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .card img {
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
            text-align: center;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card-text {
            font-size: 1rem;
            color: #666;
            margin-bottom: 15px;
        }

        .price {
            font-size: 1.25rem;
            color: #28a745;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        /* Стили для бургер-меню пользователя */
        .user-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 250px;
            background-color: #343a40; /* Темный фон */
            padding: 10px;
            text-align: center;
        }

        .user-menu .dropdown {
            position: relative;
            display: inline-block;
        }

        .user-menu .dropdown-btn {
            background-color: #495057;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .user-menu .dropdown-btn:hover {
            background-color: #6c757d;
        }

        .user-menu .dropdown-content {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            background-color: #343a40; /* Темный фон */
            min-width: 160px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
            border-radius: 5px;
            overflow: hidden;
        }

        .user-menu .dropdown-content a {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
            transition: background-color 0.3s;
        }

        .user-menu .dropdown-content a:hover {
            background-color: #495057; /* Темный фон при наведении */
        }

        .user-menu .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Боковое меню -->
    <div class="sidebar">
        <h3>Магазин</h3>
        <ul>
            <li><a href="#">Главная</a></li>
            <li><a href="#">Категория</a></li>
            <li><a href="#">Заказы</a></li>
            <li><a href="#">Контакты</a></li>
        </ul>
    </div>

    <!-- Основной контент -->
    <div class="content">
        <!-- Карточка товара 1 -->
        <div class="card">
            <img src="https://via.placeholder.com/300" alt="Товар 1">
            <div class="card-body">
                <h5 class="card-title">Товар 1</h5>
                <p class="card-text">Описание товара 1.</p>
                <p class="price">100$</p>
                <a href="#" class="btn btn-primary">Купить</a>
            </div>
        </div>
        <!-- Карточка товара 2 -->
        <div class="card">
            <img src="https://via.placeholder.com/300" alt="Товар 2">
            <div class="card-body">
                <h5 class="card-title">Товар 2</h5>
                <p class="card-text">Описание товара 2.</p>
                <p class="price">150$</p>
                <a href="#" class="btn btn-primary">Купить</a>
            </div>
        </div>
        <!-- Карточка товара 3 -->
        <div class="card">
            <img src="https://via.placeholder.com/300" alt="Товар 3">
            <div class="card-body">
                <h5 class="card-title">Товар 3</h5>
                <p class="card-text">Описание товара 3.</p>
                <p class="price">200$</p>
                <a href="#" class="btn btn-primary">Купить</a>
            </div>
        </div>
    </div>

    <!-- Бургер-меню пользователя -->
    <div class="user-menu">
        <div class="dropdown">
            <button class="dropdown-btn">Пользователь</button>
            <div class="dropdown-content">
                <a href="#">Профиль</a>
                <a href="#">Выход</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
